apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ddd-house-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: ddd-house
      rules:
        # ═══ 非 2XX 错误率告警 ═══
        - alert: HighErrorRate
          expr: |
            clamp_max(
              sum(rate(http_requests_total{exported_job="ddd-house", status!~"2.."}[5m]))
              /
              sum(rate(http_requests_total{exported_job="ddd-house"}[5m]))
            , 1) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ddd-house 非 2XX 错误率超过 10%"
            description: |
              当前错误率: {{ $value | humanizePercentage }}

        - alert: CriticalErrorRate
          expr: |
            clamp_max(
              sum(rate(http_requests_total{exported_job="ddd-house", status!~"2.."}[5m]))
              /
              sum(rate(http_requests_total{exported_job="ddd-house"}[5m]))
            , 1) > 0.25
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "ddd-house 非 2XX 错误率超过 25%"
            description: |
              当前错误率: {{ $value | humanizePercentage }}

        # ═══ 5XX 服务端错误率告警 ═══
        - alert: HighServerErrorRate
          expr: |
            clamp_max(
              sum(rate(http_requests_total{exported_job="ddd-house", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{exported_job="ddd-house"}[5m]))
            , 1) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ddd-house 5XX 服务端错误率超过 5%"
            description: |
              当前 5XX 错误率: {{ $value | humanizePercentage }}

        # ═══ 4XX 客户端错误率告警 ═══
        - alert: HighClientErrorRate
          expr: |
            clamp_max(
              sum(rate(http_requests_total{exported_job="ddd-house", status=~"4.."}[5m]))
              /
              sum(rate(http_requests_total{exported_job="ddd-house"}[5m]))
            , 1) > 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ddd-house 4XX 客户端错误率超过 15%"
            description: |
              当前 4XX 错误率: {{ $value | humanizePercentage }}
              通常由客户端请求参数错误或未授权引起

        # ═══ 服务不可用告警 (100% 非2XX) ═══
        - alert: ServiceDegraded
          expr: |
            clamp_max(
              sum(rate(http_requests_total{exported_job="ddd-house", status!~"2.."}[5m]))
              /
              sum(rate(http_requests_total{exported_job="ddd-house"}[5m]))
            , 1) > 0.9
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ddd-house 服务异常，超过 90% 请求为非 2XX"
            description: |
              错误率: {{ $value | humanizePercentage }}
              服务可能已故障，请立即检查
